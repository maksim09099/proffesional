project:
  name: face-recognition-demo
  random_seed: 42

paths:
  raw_data_dir: data/raw
  extracted_dir: data/raw/extracted
  interim_dir: data/interim
  processed_dir: data/processed
  reports_dir: reports
  models_dir: models

preprocessing:
  image_size: 160
  min_face_size: 32
  train_split: 0.8

model:
  embedding_dim: 128
  batch_size: 16
  lr: 0.001
  epochs: 5
  num_workers: 0

inference:
  detector_scale_factor: 1.1
  detector_min_neighbors: 5
